name: Key role diagnostic

# TEMPORARY. Prints only the "role" claim decoded from the stored secret's JWT
# payload, plus its character length. No key material is ever echoed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report role claim of stored secret
        run: |
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          echo "length: ${#KEY}"
          DOTS=$(echo -n "$KEY" | tr -cd '.' | wc -c)
          echo "dots: $DOTS"
          PAYLOAD=$(echo -n "$KEY" | cut -d. -f2)
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          for i in $(seq 1 $PAD); do PAYLOAD="${PAYLOAD}="; done
          DECODED=$(echo -n "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null || echo "decode-failed")
          echo "role: $(echo "$DECODED" | grep -o '\"role\":\"[a-z_]*\"' || echo none)"
          echo "ref:  $(echo "$DECODED" | grep -o '\"ref\":\"[a-z]*\"' || echo none)"
