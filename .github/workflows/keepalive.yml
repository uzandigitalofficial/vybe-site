name: Supabase keep-alive

# Supabase free-tier pauses a project after ~7 days without activity, which takes
# the Vybe backend offline (sign-in stops working). A daily read keeps it awake.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://amlztonvpwtiatmomceq.supabase.co/rest/v1/events?select=id&limit=1"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          CODE=$(curl -s -o /tmp/out.txt -w '%{http_code}' "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          cat /tmp/out.txt
          test "$CODE" = "200"
