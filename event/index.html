<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Vybe</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header><div class="wrap"><div class="logo">V</div><h1>Open this event in Vybe</h1><p>Taking you to the app…</p></div></header>
<main><div class="wrap">
  <p id="msg">If nothing happens, <a id="applink" href="#">tap here to open Vybe</a>, or get the app from the App Store.</p>
</div></main>
<footer>© 2026 Vybe</footer>
<script>
  var id = new URLSearchParams(location.search).get('id');
  var url = 'vybe://event/' + (id || '');
  document.getElementById('applink').href = url;
  if (id) setTimeout(function () { location.href = url; }, 400);
</script>
</body>
</html>
